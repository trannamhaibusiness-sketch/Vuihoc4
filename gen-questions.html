<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>🎲 Sinh câu hỏi Violympic</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: system-ui, sans-serif; }
  .log { max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px; }
</style>
</head>
<body class="bg-gray-50 min-h-screen p-6">

<div class="max-w-3xl mx-auto">
  <div class="bg-white rounded-2xl shadow-lg p-6 mb-4">
    <h1 class="text-2xl font-bold text-indigo-700 mb-2">🎲 Sinh câu hỏi Violympic lớp 4</h1>
    <p class="text-gray-600 text-sm mb-4">Bấm nút để tạo file CSV. Import file vào Google Sheets tab <code class="bg-gray-100 px-1 rounded">Questions</code>.</p>

    <div class="grid grid-cols-2 gap-3 mb-4">
      <div>
        <label class="block text-sm font-bold mb-1">Số câu muốn sinh:</label>
        <input type="number" id="numQuestions" value="500" min="10" max="2000" class="w-full border-2 border-gray-200 rounded-lg px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-bold mb-1">Track ID:</label>
        <input type="text" id="trackId" value="vio4" class="w-full border-2 border-gray-200 rounded-lg px-3 py-2" />
      </div>
    </div>

    <div class="flex gap-3">
      <button id="btn-gen" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl">🚀 Sinh & Tải CSV</button>
      <button id="btn-preview" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-6 rounded-xl">👁️ Xem trước 5 câu</button>
    </div>
  </div>

  <div class="bg-white rounded-2xl shadow-lg p-6">
    <h2 class="font-bold text-gray-700 mb-2">📊 Tiến trình:</h2>
    <div id="log" class="log bg-gray-50 rounded-lg p-3 text-gray-700"></div>
  </div>
</div>

<script>
// ============================================
// SINH CÂU HỎI VIOLYMPIC LỚP 4
// ============================================

let allQuestions = [];
let idCounter = 0;

function log(msg) {
  const el = document.getElementById('log');
  el.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
  el.scrollTop = el.scrollHeight;
}

function newId() {
  idCounter++;
  return 'q' + String(idCounter).padStart(4, '0');
}

// Helper: random số nguyên
function rand(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// Helper: chọn ngẫu nhiên từ mảng
function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

// Helper: tạo 4 đáp án, 1 đúng, 3 sai
function makeOptions(correct, wrongGenerator) {
  const wrongs = new Set();
  let attempts = 0;
  while (wrongs.size < 3 && attempts < 100) {
    const w = wrongGenerator();
    if (w !== correct && !wrongs.has(w) && w > 0 && Number.isInteger(w)) {
      wrongs.add(w);
    }
    attempts++;
  }
  // Nếu không đủ 3 wrong → thêm số nhiễu
  while (wrongs.size < 3) {
    const w = correct + rand(1, 10) * pick([-1, 1]);
    if (w > 0 && w !== correct) wrongs.add(w);
  }
  const arr = [correct, ...wrongs];
  // Shuffle
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  const correctIdx = arr.indexOf(correct);
  const letter = ['A', 'B', 'C', 'D'][correctIdx];
  return {
    options: arr.map(String),
    correct: letter,
  };
}

// ============================================
// CHỦ ĐỀ 1: CẤU TẠO SỐ, LẬP SỐ (~100 câu)
// ============================================
function genTopic1() {
  const list = [];

  // 1a. Số bé nhất / lớn nhất có n chữ số (n = 3,4,5,6)
  for (let n = 3; n <= 6; n++) {
    // Số bé nhất
    const smallest = Math.pow(10, n - 1);
    const opts = makeOptions(smallest, () => {
      const cands = [smallest - 1, smallest + 1, smallest * 10 + 1, 9999 + rand(1, 100)];
      return pick(cands);
    });
    list.push({
      question: `Số bé nhất có ${n} chữ số là số nào?`,
      options: opts.options,
      correct: opts.correct,
    });

    // Số lớn nhất
    const largest = Math.pow(10, n) - 1;
    const opts2 = makeOptions(largest, () => largest - rand(1, 1000));
    list.push({
      question: `Số lớn nhất có ${n} chữ số là số nào?`,
      options: opts2.options,
      correct: opts2.correct,
    });

    // Số bé nhất có n chữ số khác nhau
    if (n >= 3) {
      let s = '1' + '0'.repeat(n - 1);
      const smallestDiff = parseInt(s);
      const opts3 = makeOptions(smallestDiff, () => smallestDiff + rand(1, 500));
      list.push({
        question: `Số nhỏ nhất có ${n} chữ số khác nhau là số nào?`,
        options: opts3.options,
        correct: opts3.correct,
      });

      // Số lớn nhất có n chữ số khác nhau
      let digits = [];
      for (let d = 9; d >= 10 - n; d--) digits.push(d);
      const largestDiff = parseInt(digits.join(''));
      const opts4 = makeOptions(largestDiff, () => largestDiff - rand(1, 1000));
      list.push({
        question: `Số lớn nhất có ${n} chữ số khác nhau là số nào?`,
        options: opts4.options,
        correct: opts4.correct,
      });
    }
  }

  // 1b. Viết thêm chữ số X vào bên trái/phải số có k chữ số
  for (let trial = 0; trial < 20; trial++) {
    const k = rand(2, 3);
    const digit = rand(1, 9);
    const sample = rand(Math.pow(10, k - 1), Math.pow(10, k) - 1);
    const added = digit * Math.pow(10, k);
    // Đúng: cộng thêm digit * 10^k
    const opts = makeOptions(added, () => {
      return pick([digit * Math.pow(10, k - 1), digit * Math.pow(10, k + 1), digit * 10, added + rand(1, 100)]);
    });
    list.push({
      question: `Khi viết chữ số ${digit} vào bên trái một số có ${k} chữ số thì số mới hơn số cũ bao nhiêu đơn vị?`,
      options: opts.options,
      correct: opts.correct,
    });
  }

  // 1c. Viết thêm chữ số X vào bên phải số
  for (let trial = 0; trial < 10; trial++) {
    const sample = rand(100, 9999);
    const digit = rand(1, 9);
    const newNum = sample * 10 + digit;
    const diff = newNum - sample;
    const opts = makeOptions(diff, () => diff + rand(1, 1000) * pick([-1, 1]));
    list.push({
      question: `Khi viết thêm chữ số ${digit} vào bên phải số ${sample} thì số này tăng thêm bao nhiêu đơn vị?`,
      options: opts.options,
      correct: opts.correct,
    });
  }

  // 1d. Tìm số có 2-3 chữ số, biết tổng các chữ số
  for (let trial = 0; trial < 10; trial++) {
    const a = rand(1, 9);
    const b = rand(0, 9);
    const c = rand(0, 9);
    const num = a * 100 + b * 10 + c;
    const sum = a + b + c;
    const opts = makeOptions(num, () => num + rand(1, 50) * pick([-1, 1]));
    list.push({
      question: `Tìm số có ba chữ số biết tổng các chữ số của số đó bằng ${sum} và chữ số hàng trăm là ${a}, chữ số hàng chục là ${b}.`,
      options: opts.options,
      correct: opts.correct,
    });
  }

  return list;
}

// ============================================
// CHỦ ĐỀ 2: DÃY SỐ, QUY LUẬT (~80 câu)
// ============================================
function genTopic2() {
  const list = [];

  // 2a. Đếm số lẻ/chẵn trong khoảng
  for (let trial = 0; trial < 20; trial++) {
    const start = rand(100, 500);
    const end = start + rand(100, 500);
    const isOdd = Math.random() < 0.5;
    let count = 0;
    for (let i = start; i <= end; i++) {
      if (isOdd && i % 2 === 1) count++;
      if (!isOdd && i % 2 === 0) count++;
    }
    const opts = makeOptions(count, () => count + rand(1, 10) * pick([-1, 1]));
    list.push({
      question: `Dãy số tự nhiên liên tiếp từ ${start} đến ${end} có tất cả bao nhiêu số ${isOdd ? 'lẻ' : 'chẵn'}?`,
      options: opts.options,
      correct: opts.correct,
    });
  }

  // 2b. Tìm số tiếp theo của dãy
  for (let trial = 0; trial < 20; trial++) {
    const type = rand(1, 4);
    let seq, next;
    if (type === 1) {
      // Cộng đều
      const a = rand(1, 5);
      const d = rand(2, 9);
      seq = [a, a + d, a + 2 * d, a + 3 * d];
      next = a + 4 * d;
    } else if (type === 2) {
      // Nhân đôi
      const a = rand(1, 3);
      seq = [a, a * 2, a * 4, a * 8];
      next = a * 16;
    } else if (type === 3) {
      // Số chính phương
      const a = rand(1, 5);
      seq = [a * a, (a + 1) * (a + 1), (a + 2) * (a + 2), (a + 3) * (a + 3)];
      next = (a + 4) * (a + 4);
    } else {
      // Fibonacci
      const a = rand(1, 3);
      const b = a + rand(1, 3);
      seq = [a, b, a + b, a + 2 * b];
      next = 2 * a + 3 * b;
    }
    const opts = makeOptions(next, () => next + rand(1, 10) * pick([-1, 1]));
    list.push({
      question: `Số tiếp theo của dãy: ${seq.join(', ')}, ... là số nào?`,
      options: opts.options,
      correct: opts.correct,
    });
  }

  // 2c. Số số hạng của dãy
  for (let trial = 0; trial < 20; trial++) {
    const a = rand(1, 10);
    const d = rand(2, 5);
    const n = rand(5, 20);
    const last = a + (n - 1) * d;
    const seqStr = `${a}, ${a + d}, ${a + 2 * d}, ..., ${last}`;
    const opts = makeOptions(n, () => n + rand(1, 5) * pick([-1, 1]));
    list.push({
      question: `Dãy số ${seqStr} có bao nhiêu số hạng?`,
      options: opts.options,
      correct: opts.correct,
    });
  }

  return list;
}

// ============================================
// CHỦ ĐỀ 3: TRUNG BÌNH CỘNG (~80 câu)
// ============================================
function genTopic3() {
  const list = [];

  // 3a. TBC của 2-5 số
  for (let trial = 0; trial < 30; trial++) {
    const n = rand(2, 5);
    const nums = [];
    let sum = 0;
    for (let i = 0; i < n; i++) {
      const x = rand(10, 100);
      nums.push(x);
      sum += x;
    }
    // Đảm bảo chia hết
    const adjust = sum % n;
    if (adjust !== 0) {
      nums[0] += n - adjust;
      sum += n - adjust;
    }
    const tbc = sum / n;
    const opts = makeOptions(tbc, () => tbc + rand(1, 10) * pick([-1, 1]));
    list.push({
      question: `Trung bình cộng của các số ${nums.join(', ')} là bao nhiêu?`,
      options: opts.options,
      correct: opts.correct,
    });
  }

  // 3b. TBC của dãy số liên tiếp
  for (let trial = 0; trial < 15; trial++) {
    const a = rand(1, 20);
    const n = rand(3, 9);
    const b = a + n - 1;
    const tbc = (a + b) / 2;
    if (!Number.isInteger(tbc)) continue;
    const opts = makeOptions(tbc, () => tbc + rand(1, 5) * pick([-1, 1]));
    list.push({
      question: `Trung bình cộng của các số tự nhiên liên tiếp từ ${a} đến ${b} là bao nhiêu?`,
      options: opts.options,
      correct: opts.correct,
    });
  }

  // 3c. TBC của số lẻ / chẵn liên tiếp
  for (let trial = 0; trial < 15; trial++) {
    const isOdd = Math.random() < 0.5;
    let a = rand(1, 20);
    if (isOdd && a % 2 === 0) a++;
    if (!isOdd && a % 2 === 1) a++;
    const n = rand(3, 7);
    const b = a + (n - 1) * 2;
    const tbc = (a + b) / 2;
    const opts = makeOptions(tbc, () => tbc + rand(1, 5) * pick([-1, 1]));
    list.push({
      question: `Trung bình cộng của các số ${isOdd ? 'lẻ' : 'chẵn'} liên tiếp từ ${a} đến ${b} là bao nhiêu?`,
      options: opts.options,
      correct: opts.correct,
    });
  }

  // 3d. Cho TBC và 1 số, tìm số còn lại
  for (let trial = 0; trial < 20; trial++) {
    const a = rand(10, 50);
    const tbc = rand(a + 1, 80);
    const b = 2 * tbc - a;
    if (b <= 0) continue;
    const opts = makeOptions(b, () => b + rand(1, 10) * pick([-1, 1]));
    list.push({
      question: `Trung bình cộng của hai số là ${tbc}. Biết một số là ${a}. Số còn lại là bao nhiêu?`,
      options: opts.options,
      correct: opts.correct,
    });
  }

  return list;
}

// ============================================
// CHỦ ĐỀ 4: TỔNG - HIỆU, TỔNG - TỈ (~100 câu)
// ============================================
function genTopic4() {
  const list = [];

  // 4a. Tổng - hiệu: tìm 2 số
  for (let trial = 0; trial < 40; trial++) {
    const a = rand(10, 200); // số bé
    const diff = rand(1, 50);
    const b = a + diff; // số lớn
    const sum = a + b;
    const askLarge = Math.random() < 0.5;
    const answer = askLarge ? b : a;
    const opts = makeOptions(answer, () => answer + rand(1, 20) * pick([-1, 1]));
    list.push({
      question: `Tổng của hai số là ${sum}, hiệu của chúng là ${diff}. Tìm số ${askLarge ? 'lớn' : 'bé'}.`,
      options: opts.options,
      correct: opts.correct,
    });
  }

  // 4b. Tổng - hiệu với nội dung thực tế
  const objects1 = ['viên bi', 'quyển vở', 'cái kẹo', 'quả cam', 'con tem'];
  const objects2 = ['cây', 'con gà', 'cái bút', 'quyển sách'];
  for (let trial = 0; trial < 20; trial++) {
    const obj = pick(objects1);
    const obj2 = pick(objects2);
    const a = rand(20, 100);
    const diff = rand(1, 30);
    const b = a + diff;
    const sum = a + b;
    const askLarge = Math.random() < 0.5;
    const answer = askLarge ? b : a;
    const opts = makeOptions(answer, () => answer + rand(1, 15) * pick([-1, 1]));
    list.push({
      question: `Hai bạn có tất cả ${sum} ${obj}. Bạn An nhiều hơn bạn Bình ${diff} ${obj}. Hỏi bạn ${askLarge ? 'An' : 'Bình'} có bao nhiêu ${obj}?`,
      options: opts.options,
      correct: opts.correct,
    });
  }

  // 4c. Tổng - tỉ (gấp đôi, gấp ba)
  for (let trial = 0; trial < 40; trial++) {
    const ratio = rand(2, 5);
    const small = rand(10, 50);
    const large = small * ratio;
    const sum = small + large;
    const askLarge = Math.random() < 0.5;
    const answer = askLarge ? large : small;
    const opts = makeOptions(answer, () => answer + rand(1, 30) * pick([-1, 1]));
    list.push({
      question: `Tổng của hai số là ${sum}. Số lớn gấp ${ratio} lần số bé. Tìm số ${askLarge ? 'lớn' : 'bé'}.`,
      options: opts.options,
      correct: opts.correct,
    });
  }

  return list;
}

// ============================================
// CHỦ ĐỀ 5: ĐƠN VỊ ĐO, HÌNH HỌC, CHIA HẾT (~140 câu)
// ============================================
function genTopic5() {
  const list = [];

  // 5a. Đổi đơn vị đo
  const units = [
    { from: 'km', to: 'm', factor: 1000 },
    { from: 'm', to: 'cm', factor: 100 },
    { from: 'm', to: 'dm', factor: 10 },
    { from: 'dm', to: 'cm', factor: 10 },
    { from: 'cm', to: 'mm', factor: 10 },
    { from: 'kg', to: 'g', factor: 1000 },
    { from: 'tấn', to: 'kg', factor: 1000 },
    { from: 'tạ', to: 'kg', factor: 100 },
    { from: 'yến', to: 'kg', factor: 10 },
    { from: 'giờ', to: 'phút', factor: 60 },
    { from: 'phút', to: 'giây', factor: 60 },
    { from: 'm²', to: 'dm²', factor: 100 },
    { from: 'dm²', to: 'cm²', factor: 100 },
  ];
  for (let trial = 0; trial < 30; trial++) {
    const u = pick(units);
    const x = rand(1, 20);
    const answer = x * u.factor;
    const opts = makeOptions(answer, () => answer + rand(1, 10) * u.factor * pick([-1, 1]));
    list.push({
      question: `${x} ${u.from} = ? ${u.to}`,
      options: opts.options,
      correct: opts.correct,
    });
  }

  // 5b. Chu vi, diện tích hình vuông
  for (let trial = 0; trial < 20; trial++) {
    const a = rand(2, 20);
    const askArea = Math.random() < 0.5;
    const answer = askArea ? a * a : 4 * a;
    const opts = makeOptions(answer, () => answer + rand(1, 10) * pick([-1, 1]));
    list.push({
      question: `Hình vuông có cạnh ${a}cm. ${askArea ? 'Diện tích' : 'Chu vi'} hình vuông là bao nhiêu?`,
      options: askArea ? opts.options.map((x) => x + 'cm²') : opts.options.map((x) => x + 'cm'),
      correct: opts.correct,
    });
  }

  // 5c. Chu vi, diện tích hình chữ nhật
  for (let trial = 0; trial < 30; trial++) {
    const a = rand(2, 20);
    const b = rand(2, 20);
    const askArea = Math.random() < 0.5;
    const answer = askArea ? a * b : 2 * (a + b);
    const opts = makeOptions(answer, () => answer + rand(1, 10) * pick([-1, 1]));
    list.push({
      question: `Hình chữ nhật có chiều dài ${a}cm, chiều rộng ${b}cm. ${askArea ? 'Diện tích' : 'Chu vi'} hình chữ nhật là bao nhiêu?`,
      options: askArea ? opts.options.map((x) => x + 'cm²') : opts.options.map((x) => x + 'cm'),
      correct: opts.correct,
    });
  }

  // 5d. Chia hết cho 2, 3, 5, 9
  const divisors = [2, 3, 5, 9];
  for (let trial = 0; trial < 40; trial++) {
    const d = pick(divisors);
    const correct = rand(2, 100) * d;
    const opts = makeOptions(correct, () => correct + rand(1, 10) * pick([-1, 1]));
    list.push({
      question: `Trong các số sau, số nào chia hết cho ${d}?`,
      options: opts.options,
      correct: opts.correct,
    });
  }

  // 5e. Tìm x
  for (let trial = 0; trial < 20; trial++) {
    const a = rand(2, 20);
    const b = rand(2, 20);
    const op = pick(['+', '-', '×', ':']);
    let question, answer;
    if (op === '+') { answer = a + b; question = `x - ${a} = ${b}. Tìm x.`; }
    else if (op === '-') { answer = a - b; if (answer < 0) continue; question = `x + ${b} = ${a}. Tìm x.`; }
    else if (op === '×') { answer = a * b; question = `x : ${a} = ${b}. Tìm x.`; }
    else { answer = a; question = `${a * b} : x = ${b}. Tìm x.`; }
    const opts = makeOptions(answer, () => answer + rand(1, 10) * pick([-1, 1]));
    list.push({ question, options: opts.options, correct: opts.correct });
  }

  return list;
}

// ============================================
// GENERATE
// ============================================
function generateAll(num) {
  allQuestions = [];
  idCounter = 0;
  log('🚀 Bắt đầu sinh câu hỏi...');

  const topics = [
    { name: 'Cấu tạo số', fn: genTopic1 },
    { name: 'Dãy số', fn: genTopic2 },
    { name: 'Trung bình cộng', fn: genTopic3 },
    { name: 'Tổng-hiệu/Tổng-tỉ', fn: genTopic4 },
    { name: 'Đơn vị/Hình học/Chia hết', fn: genTopic5 },
  ];

  // Sinh theo tỉ lệ
  const ratio = [0.2, 0.16, 0.16, 0.2, 0.28];
  topics.forEach((t, i) => {
    const count = Math.floor(num * ratio[i]);
    log(`📝 Sinh ${count} câu chủ đề "${t.name}"...`);
    for (let k = 0; k < count; k++) {
      const batch = t.fn();
      const q = pick(batch);
      allQuestions.push(q);
    }
  });

  // Nếu thiếu → bù
  while (allQuestions.length < num) {
    const t = pick(topics);
    const batch = t.fn();
    allQuestions.push(pick(batch));
  }
  allQuestions = allQuestions.slice(0, num);

  // Gán ID
  allQuestions.forEach((q) => { q.id = newId(); });
  log(`✅ Đã sinh ${allQuestions.length} câu hỏi.`);
  return allQuestions;
}

// ============================================
// EXPORT CSV
// ============================================
function exportCSV() {
  const trackId = document.getElementById('trackId').value.trim() || 'vio4';
  // Header khớp với Sheet: id | subject_id | track_id | question | option_a | option_b | option_c | option_d | correct | difficulty
  const header = ['id', 'subject_id', 'track_id', 'question', 'option_a', 'option_b', 'option_c', 'option_d', 'correct', 'difficulty'];
  const rows = [header];

  allQuestions.forEach((q) => {
    rows.push([
      q.id,
      'toan',
      trackId,
      q.question,
      q.options[0] || '',
      q.options[1] || '',
      q.options[2] || '',
      q.options[3] || '',
      q.correct,
      String(rand(1, 3)),
    ]);
  });

  // Escape CSV: bọc "" và nhân đôi " bên trong
  const csv = rows.map((r) =>
    r.map((cell) => {
      const s = String(cell == null ? '' : cell);
      return '"' + s.replace(/"/g, '""') + '"';
    }).join(',')
  ).join('\n');

  // Thêm BOM để Excel nhận UTF-8
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `violympic-${allQuestions.length}cau-${Date.now()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  log(`💾 Đã tải file CSV (${allQuestions.length} câu).`);
}

// ============================================
// UI EVENTS
// ============================================
document.getElementById('btn-gen').addEventListener('click', () => {
  const num = parseInt(document.getElementById('numQuestions').value) || 500;
  log(`=== Bắt đầu sinh ${num} câu ===`);
  generateAll(num);
  exportCSV();
});

document.getElementById('btn-preview').addEventListener('click', () => {
  generateAll(50);
  const preview = allQuestions.slice(0, 5);
  log('👁️ Xem trước 5 câu:');
  preview.forEach((q, i) => {
    log(`${i + 1}. ${q.question}`);
    log(`   A. ${q.options[0]} | B. ${q.options[1]} | C. ${q.options[2]} | D. ${q.options[3]} → Đáp án: ${q.correct}`);
  });
});

log('✅ Sẵn sàng. Bấm nút để sinh câu hỏi.');
</script>
