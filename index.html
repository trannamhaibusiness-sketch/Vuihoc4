<style>
* { -webkit-tap-highlight-color: transparent; }
body { font-family: 'Nunito', sans-serif; overscroll-behavior: none; }

.role-btn { transition: all 0.2s ease; }
.role-btn.role-active {
  border-color: #6366f1 !important;
  background: #6366f1 !important;
  color: white !important;
  box-shadow: 0 10px 20px -5px rgba(99,102,241,0.5);
  transform: translateY(-2px);
}

.answer-option {
  transition: all 0.15s ease;
  cursor: pointer;
  user-select: none;
}
.answer-option:hover:not(.answer-disabled):not(.answer-correct):not(.answer-wrong) {
  transform: translateX(6px);
  border-color: #6366f1;
  background: #eef2ff;
}
.answer-option.answer-correct {
  border-color: #34D399 !important;
  background: #d1fae5 !important;
  animation: correctPulse 0.4s ease;
}
.answer-option.answer-wrong {
  border-color: #FB7185 !important;
  background: #ffe4e6 !important;
  animation: wrongShake 0.4s ease;
}
.answer-option.answer-disabled {
  cursor: not-allowed;
  opacity: 0.75;
  pointer-events: none;
}
@keyframes correctPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
@keyframes wrongShake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

.timer-bar { transition: width 1s linear, background-color 0.3s ease; }

.toast { animation: toastSlideIn 0.3s ease-out; }
@keyframes toastSlideIn {
  from { opacity:0; transform:translateY(-20px); }
  to   { opacity:1; transform:translateY(0); }
}

.confetti {
  position: fixed; width: 10px; height: 10px;
  pointer-events: none; z-index: 100;
  animation: confettiFall 2.5s linear forwards;
}
@keyframes confettiFall {
  0%   { transform:translateY(-100vh) rotate(0deg); opacity:1; }

}

.animate-pop { animation: popIn 0.3s cubic-bezier(0.68,-0.55,0.27,1.55); }
@keyframes popIn {
  0%   { transform:scale(0.5); opacity:0; }
  100% { transform:scale(1); opacity:1; }
}

.spinner {
  border: 4px solid #e0e7ff;
  border-top: 4px solid #6366f1;

// ===== API CLIENT =====
async function apiCall(action, payload = {}, method = 'GET') {
  try {
    let url = API_URL;
    const options = { method };
    if (method === 'GET') {
      const params = new URLSearchParams({ key: API_KEY, action, ...payload });
      url += '?' + params.toString();
      options.redirect = 'follow';
    } else {
      options.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
      options.body = JSON.stringify({ key: API_KEY, action, payload });
      options.redirect = 'follow';
    }
    const res = await fetch(url, options);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'API error');
    return json.data;
  } catch (err) {
    console.error('[API]', action, err);
    throw err;
  }
}

function shuffleOptions(q) {
  const indices = [0,1,2,3].sort(() => Math.random() - 0.5);
  const newOptions = indices.map((i) => q.options[i]);
  const newCorrect = indices.indexOf(q.correct);
  return { ...q, options: newOptions, correct: newCorrect };
}
function getLocalQuestions(subject, track, n) {
  const pool = FALLBACK_QUESTIONS.filter((q) => q.subject === subject && q.track === track);
  return [...pool].sort(() => Math.random() - 0.5).slice(0, n).map(shuffleOptions);
}

function showToast(message, type = 'info', duration = 2500) {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const colors = {
    success:'bg-mint text-white', error:'bg-coral text-white',

  const toast = document.createElement('div');
  toast.className = `toast ${colors[type]} font-bold px-5 py-3 rounded-2xl shadow-2xl text-sm max-w-xs text-center`;
  toast.textContent = `${icons[type]} ${message}`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.transition = 'opacity 0.3s, transform 0.3s';
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(-20px)';
    setTimeout(() => toast.remove(), 300);
  }, duration);
}

function playSound(type = 'click') {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    const playTone = (freq, start, duration, wave = 'sine', volume = 0.15) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = wave;
      osc.frequency.setValueAtTime(freq, now + start);
      gain.gain.setValueAtTime(volume, now + start);
      gain.gain.exponentialRampToValueAtTime(0.001, now + start + duration);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now + start); osc.stop(now + start + duration);
    };
    if (type === 'click') playTone(600, 0, 0.08, 'sine', 0.08);
    else if (type === 'tick') playTone(1000, 0, 0.03, 'square', 0.05);
    else if (type === 'win') [523.25,659.25,783.99,1046.5].forEach((f,i) => playTone(f, i*0.12, 0.2, 'sine', 0.18));
    else if (type === 'coin') {
      playTone(1318.5, 0, 0.08, 'sine', 0.15);
      playTone(1567.98, 0.06, 0.15, 'sine', 0.15);
    }
    setTimeout(() => ctx.close(), 2000);
  } catch (e) {}
}

function playCorrectSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    const playNote = (freq, start, duration, volume = 0.15) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + start);
      gain.gain.setValueAtTime(volume, now + start);
      gain.gain.exponentialRampToValueAtTime(0.001, now + start + duration);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now + start); osc.stop(now + start + duration);
    };
    playNote(1046.5, 0, 0.15, 0.2);
    playNote(1318.5, 0.12, 0.25, 0.2);
    playNote(2093, 0, 0.1, 0.08);
    playNote(2637, 0.12, 0.15, 0.08);
    setTimeout(() => ctx.close(), 1500);
  } catch (e) {}
}

function playWrongSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.exponentialRampToValueAtTime(120, now + 0.45);
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1200, now);
    filter.frequency.exponentialRampToValueAtTime(400, now + 0.45);
    gain.gain.setValueAtTime(0.18, now);
    gain.gain.setValueAtTime(0.18, now + 0.35);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
    osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.5);
    setTimeout(() => ctx.close(), 1000);
  } catch (e) {}
}

function showConfirm(title, message, okText = 'Đồng ý', cancelText = 'Hủy') {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4';
    overlay.innerHTML = `
      <div class="bg-white rounded-3xl shadow-2xl p-6 max-w-sm w-full text-center animate-pop">
        <div class="text-5xl mb-3">🤔</div>
        <h3 class="font-baloo text-2xl font-bold text-brand-700 mb-2">${title}</h3>

        <div class="grid grid-cols-2 gap-3">
          <button id="confirm-cancel" class="bg-gray-200 text-gray-700 font-bold py-3 rounded-2xl hover:bg-gray-300 transition">${cancelText}</button>
          <button id="confirm-ok" class="bg-gradient-to-r from-brand-500 to-brand-700 text-white font-bold py-3 rounded-2xl hover:scale-105 transition">${okText}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const cleanup = (result) => {
      overlay.style.opacity = '0';
      overlay.style.transition = 'opacity 0.2s';
      setTimeout(() => overlay.remove(), 200);
      resolve(result);
    };
    overlay.querySelector('#confirm-ok').addEventListener('click', () => { playSound('click'); cleanup(true); });
    overlay.querySelector('#confirm-cancel').addEventListener('click', () => { playSound('click'); cleanup(false); });
    overlay.addEventListener('click', (e) => { if (e.target === overlay) cleanup(false); });
  });
}

function initLoginEvents() {
  const roleBtns = document.querySelectorAll('.role-btn');
  const roleInput = document.getElementById('role-input');
  const togglePwd = document.getElementById('toggle-password');
  const pwdInput = document.getElementById('password-input');
  const loginBtn = document.getElementById('login-btn');
  const loginBtnText = document.getElementById('login-btn-text');
  const errorBox = document.getElementById('login-error');
  const errorText = document.getElementById('login-error-text');

  roleBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      playSound('click');
      roleBtns.forEach((b) => {
        b.classList.remove('role-active','bg-brand-500','text-white','border-brand-500');
        b.classList.add('bg-white','text-brand-600','border-brand-200');
      });
      btn.classList.add('role-active','bg-brand-500','text-white','border-brand-500');
      btn.classList.remove('bg-white','text-brand-600','border-brand-200');
      state.selectedRole = btn.dataset.role;
      roleInput.value = btn.dataset.role;
      errorBox.classList.add('hidden');
    });
  });

  togglePwd.addEventListener('click', () => {
    playSound('click');
    const isPwd = pwdInput.type === 'password';
    pwdInput.type = isPwd ? 'text' : 'password';
    togglePwd.textContent = isPwd ? '🙈' : '👁️';
  });

  loginBtn.addEventListener('click', handleLogin);
  [document.getElementById('username-input'), pwdInput].forEach((el) => {
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });
  });

  async function handleLogin() {
    const username = document.getElementById('username-input').value.trim().toLowerCase();
    const password = pwdInput.value.trim();
    const role = state.selectedRole;
    errorBox.classList.add('hidden');

    if (!username || !password) {
      errorText.textContent = 'Vui lòng nhập đầy đủ!';
      errorBox.classList.remove('hidden');
      playSound('click');
      return;
    }

    loginBtn.disabled = true;
    loginBtnText.innerHTML = '<div class="spinner" style="width:24px;height:24px;border-width:3px;"></div>';

    let user = null;
    try {
      if (state.isOnline) {
        const data = await apiCall('login', { username, password });
        if (data.user) user = data.user;
      }
    } catch (err) { console.warn('[Login]', err); }

    if (!user) {
      const localUser = FALLBACK_USERS.find((u) => u.username === username && u.password === password);
      if (localUser) { const { password: _, ...rest } = localUser; user = rest; }
    }

    loginBtn.disabled = false;
    loginBtnText.textContent = '🚀 Vào chơi!';

    if (!user) {
      errorText.textContent = 'Sai tên hoặc mật khẩu!';
      errorBox.classList.remove('hidden');
      playSound('click');
      return;
    }
    if (user.role !== 'admin' && user.role !== role) {
      errorText.textContent = `Tài khoản này là "${user.role}"!`;
      errorBox.classList.remove('hidden');
      playSound('click');
      return;
    }

    playSound('win');
    state.currentUser = user;
    showToast(`Chào ${user.display_name}! 🎉`, 'success');

    // Claim daily login bonus nếu là student
    if (user.role === 'student' && state.isOnline) {
      try {
        const bonus = await apiCall('claimDailyLogin', { user_id: user.id }, 'POST');
        if (bonus && !bonus.alreadyClaimed && bonus.bonus > 0) {
          setTimeout(() => {
            showToast(`🎁 Nhận ${formatVND(bonus.bonus)} đăng nhập hôm nay!`, 'success', 4000);
            playSound('coin');
          }, 800);
        }
      } catch (err) { console.warn('[Daily]', err); }
    }

    setTimeout(async () => {
      if (user.role === 'student') {
        await loadUserStatus();
        renderStudentHome();
      }
      else if (user.role === 'parent') renderParentHome();
      else renderAdminHome();
    }, 500);
  }
}

// ===== LOAD USER STATUS =====
async function loadUserStatus() {
  if (!state.currentUser || !state.isOnline) return null;
  try {
    const status = await apiCall('getUserStatus', { user_id: state.currentUser.id });
    if (status && !status.error) {
      state.userStatus = status;
      return status;
    }
  } catch (err) { console.warn('[Status]', err); }
  return null;
}

// ===== QUIZ =====
async function startRound() {
  playSound('click');
  const subject = state.selectedSubject;
  const track = state.selectedTrack;
  if (!subject || !track) return;

  const app = document.getElementById('app');
  app.innerHTML = `<section class="flex-1 flex items-center justify-center p-4"><div class="text-center"><div class="spinner"></div><p class="text-brand-600 font-bold mt-4">Đang tải câu hỏi...</p></div></section>`;

  let questions = [];
  try {
    if (state.isOnline) {
      const data = await apiCall('getQuestions', { subject: subject.id, track: track.id, limit: 10 });
      questions = (data || []).map((q) => shuffleOptions(q));
    }
  } catch (err) { console.warn('[Quiz]', err); }
  if (!questions || questions.length === 0) questions = getLocalQuestions(subject.id, track.id, 10);
  if (questions.length === 0) {
    showToast('Chưa có câu hỏi!', 'warning');
    renderTrackScreen();
    return;
  }

  state.currentRound = {
    subject, track, questions,
    answers: new Array(questions.length).fill(null),
    currentIndex: 0, score: 0,
    timeLeft: 600, timerId: null, locked: false,
  };
  renderQuizScreen();
  startTimer();
}

function renderQuizScreen() {
  const r = state.currentRound;
  if (!r) return;
  const q = r.questions[r.currentIndex];
  const app = document.getElementById('app');

  app.innerHTML = `
    <section class="flex-1 p-4">
      <div class="max-w-2xl mx-auto w-full">
        <div class="bg-white/90 rounded-2xl shadow-lg p-4 mb-4">

          </div>
          <div class="flex justify-between items-center mb-2">
            <span class="font-bold text-brand-700">Câu ${r.currentIndex + 1}/${r.questions.length}</span>
            <span id="timer-text" class="font-bold text-brand-700 text-lg">⏱️ 10:00</span>
          </div>
          <div class="w-full bg-brand-100 rounded-full h-3 overflow-hidden mb-3">
            <div id="timer-bar" class="timer-bar h-full bg-gradient-to-r from-mint to-sky" style="width: 100%"></div>
          </div>
          <button id="submit-btn" class="w-full bg-coral hover:bg-coral/90 text-white font-bold py-2 rounded-xl text-sm transition">📤 Nộp bài</button>
        </div>

        <div class="bg-white/90 rounded-3xl shadow-2xl p-6 mb-4">
          <p class="font-baloo text-xl font-bold text-brand-700 mb-5 leading-relaxed">${q.question}</p>
          <div class="grid gap-3" id="options-container">
            ${q.options.map((opt, i) => `
              <button class="answer-option w-full text-left px-5 py-4 rounded-2xl border-4 border-brand-200 bg-white font-bold text-lg text-brand-700" data-index="${i}">
                <span class="inline-block w-8 h-8 rounded-full bg-brand-100 text-brand-700 text-center leading-8 mr-3 font-bold">${String.fromCharCode(65 + i)}</span>
                <span>${opt}</span>
              </button>`).join('')}
          </div>
        </div>

        <div id="feedback-area" class="hidden mb-4"></div>
      </div>
    </section>`;

  if (r.answers[r.currentIndex] !== null) revealAnswer(r.answers[r.currentIndex]);
  bindQuizEvents();
  updateTimerUI();
}

function bindQuizEvents() {
  const r = state.currentRound;
  const options = document.querySelectorAll('.answer-option');
  const submitBtn = document.getElementById('submit-btn');
  if (!r.locked) {
    options.forEach((btn) => {
      btn.addEventListener('click', () => handleAnswer(parseInt(btn.dataset.index)));
    });
  }
  submitBtn.addEventListener('click', confirmSubmit);
}

function handleAnswer(selectedIdx) {
  const r = state.currentRound;
  if (r.locked) return;
  const q = r.questions[r.currentIndex];
  r.answers[r.currentIndex] = selectedIdx;
  r.locked = true;

  if (selectedIdx === q.correct) {
    playCorrectSound();
    r.score++;
    fireConfetti(15);
  } else {
    playWrongSound();
  }
  revealAnswer(selectedIdx);

  const scoreEl = document.getElementById('score-display');
  if (scoreEl) scoreEl.textContent = `⭐ ${r.score}`;

  setTimeout(() => {
    if (r.currentIndex === r.questions.length - 1) {
      showToast('Đã hết câu! Bấm "Nộp bài"', 'info', 3000);
    } else {
      r.currentIndex++;
      r.locked = false;
      renderQuizScreen();
    }
  }, 1500);
}

function revealAnswer(selectedIdx) {
  const r = state.currentRound;
  const q = r.questions[r.currentIndex];
  const options = document.querySelectorAll('.answer-option');
  options.forEach((btn, i) => {
    btn.classList.add('answer-disabled');
    if (i === q.correct) btn.classList.add('answer-correct');
    else if (i === selectedIdx && selectedIdx !== q.correct) btn.classList.add('answer-wrong');
  });

  const feedbackArea = document.getElementById('feedback-area');
  if (feedbackArea) {
    feedbackArea.classList.remove('hidden');
    if (selectedIdx === q.correct) {
      feedbackArea.innerHTML = `<div class="bg-mint/20 border-4 border-mint rounded-2xl p-4 text-center animate-pop"><p class="font-baloo text-xl font-bold text-mint">🎉 Chính xác! +1 điểm</p></div>`;

    }
  }
}

async function confirmSubmit() {
  const r = state.currentRound;
  if (!r) return;
  const answered = r.answers.filter((a) => a !== null).length;
  const unanswered = r.questions.length - answered;
  let message = `Bé đã làm ${answered}/${r.questions.length} câu.`;
  if (unanswered > 0) message += ` Còn ${unanswered} câu chưa trả lời!`;
  message += ' Bé có chắc muốn nộp bài?';
  const ok = await showConfirm('Nộp bài?', message, '📤 Nộp', '↩️ Tiếp tục');
  if (ok) submitRound();
}

function startTimer() {
  const r = state.currentRound;
  if (r.timerId) clearInterval(r.timerId);
  updateTimerUI();
  r.timerId = setInterval(() => {
    r.timeLeft--;
    updateTimerUI();
    if (r.timeLeft <= 10 && r.timeLeft > 0) playSound('tick');
    if (r.timeLeft <= 0) {
      clearInterval(r.timerId);
      showToast('Hết giờ! Tự động nộp bài', 'warning');
      submitRound();
    }
  }, 1000);
}

function updateTimerUI() {
  const r = state.currentRound;
  if (!r) return;
  const text = document.getElementById('timer-text');
  const bar = document.getElementById('timer-bar');
  if (!text || !bar) return;
  const min = Math.floor(r.timeLeft / 60);
  const sec = r.timeLeft % 60;
  text.textContent = `⏱️ ${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
  const pct = (r.timeLeft / 600) * 100;
  bar.style.width = pct + '%';
  if (pct < 10) { bar.style.background = '#FB7185'; text.classList.add('text-coral', 'animate-pulse'); }
  else if (pct < 30) { bar.style.background = '#FCD34D'; text.classList.remove('text-coral', 'animate-pulse'); }
  else { bar.style.background = 'linear-gradient(to right, #34D399, #38BDF8)'; text.classList.remove('text-coral', 'animate-pulse'); }
}

async function submitRound() {
  const r = state.currentRound;
  if (r.timerId) clearInterval(r.timerId);
  const score = r.score;
  const total = r.questions.length;

  if (score >= 7) { playSound('win'); fireConfetti(50); }
  else if (score >= 4) { playSound('click'); }

  let rewardData = null;
  if (state.currentUser) {
    const prevTotal = parseInt(state.currentUser.total_score) || 0;
    state.currentUser.total_score = prevTotal + score;

    if (state.isOnline) {
      try {
        rewardData = await apiCall('saveResult', {
          user_id: state.currentUser.id,
          subject_id: r.subject.id,
          track_id: r.track.id,
          score, total_questions: total, round_number: 1,
        }, 'POST');
      } catch (err) {
        console.warn('[Save]', err);
        saveScoreLocal(state.currentUser.username, score);
      }
    } else {
      saveScoreLocal(state.currentUser.username, score);
    }
  }

  setTimeout(() => renderResultScreen(score, total, rewardData), 300);
}

function saveScoreLocal(username, score) {
  try {
    const key = 'vuihoc_scores';
    const data = JSON.parse(localStorage.getItem(key) || '{}');
    if (!data[username]) data[username] = { total: 0, history: [] };
    data[username].total += score;
    data[username].history.push({ score, at: new Date().toISOString() });
    localStorage.setItem(key, JSON.stringify(data));
  } catch (e) {}
}

// Màn hình vòng quay
function renderSpinScreen(type) {
  const isStreak = type === 'streak';
  const wheelData = isStreak ? STREAK_WHEEL : DAILY_WHEEL;
  const n = wheelData.length;
  const angle = 360 / n;

  // Tạo SVG conic gradient cho wheel
  let conicParts = [];
  wheelData.forEach((item, i) => {
    const start = i * angle;
    const end = (i + 1) * angle;
    conicParts.push(`${item.color} ${start}deg ${end}deg`);
  });
  const wheelBg = `conic-gradient(${conicParts.join(', ')})`;

  // Tạo labels
  let labelsHTML = '';
  wheelData.forEach((item, i) => {
    const labelAngle = i * angle + angle / 2;
    labelsHTML += `
      <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(${labelAngle}deg) translateY(-100px); color: white; font-weight: 800; font-size: 18px; text-shadow: 0 2px 4px rgba(0,0,0,0.4); pointer-events: none;">
        ${item.label}
      </div>`;
  });

  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderNavBar({ showBack: true, showHome: true })}
    <section class="flex-1 flex items-center justify-center p-4 pt-20">
      <div class="max-w-md w-full bg-white/90 rounded-3xl shadow-2xl p-6 text-center">
        <h2 class="font-baloo text-3xl font-bold text-brand-700 mb-1">
          ${isStreak ? '🔥 Vòng quay STREAK' : '💎 Vòng quay DAILY'}
        </h2>
        <p class="text-brand-500 mb-5 text-sm">
          ${isStreak ? 'Giải thưởng: 1K • 2K • 3K • 5K' : 'Giải thưởng: 1K • 2K • 5K • 10K • 20K'}
        </p>

        <div class="wheel-container mb-5">
          <div class="wheel-pointer">🔻</div>
          <div id="wheel" class="wheel" style="background: ${wheelBg};">
            <div style="position: absolute; inset: 0;">${labelsHTML}</div>
          </div>
          <div class="wheel-center">🎁</div>
        </div>

        <button id="btn-do-spin" class="w-full bg-gradient-to-r from-sunny to-coral text-white font-baloo font-bold text-xl py-4 rounded-2xl shadow-lg hover:scale-105 transition">
          🎰 QUAY!
        </button>

        <div id="spin-result" class="mt-4 hidden"></div>
      </div>
    </section>`;

  attachNavEvents({
    onBack: () => { renderSpinSelection(); },
    onHome: () => { renderStudentHome(); },
  });

  let spinning = false;
  document.getElementById('btn-do-spin').addEventListener('click', async () => {
    if (spinning) return;
    spinning = true;
    const btn = document.getElementById('btn-do-spin');
    btn.disabled = true;
    btn.textContent = '⏳ Đang quay...';

    // Gọi API lấy giải
    let rewardValue = null;
    try {
      if (state.isOnline) {
        const res = await apiCall('spinReward', { user_id: state.currentUser.id, spin_type: type }, 'POST');
        if (res && res.value) {
          rewardValue = res.value;
        } else if (res && res.error) {
          showToast(res.error, 'error');
          spinning = false;
          btn.disabled = false;
          btn.textContent = '🎰 QUAY!';
          return;
        }
      }
    } catch (err) {
      console.warn('[Spin]', err);
      // Fallback: random local
      const vals = isStreak ? [1000,1000,1000,2000,2000,3000,5000] : [1000,1000,2000,2000,5000,5000,10000,20000];
      rewardValue = vals[Math.floor(Math.random() * vals.length)];
    }

    if (!rewardValue) rewardValue = 1000;

    // Tìm vị trí của giải trên wheel
    let targetIdx = wheelData.findIndex((x) => x.value === rewardValue);
    if (targetIdx < 0) targetIdx = 0;

    // Tính góc quay để mũi tên chỉ vào targetIdx
    // Mũi tên ở trên (0deg). Mỗi slice chiếm angle độ.
    // Để mũi tên chỉ vào slice idx, cần quay wheel sao cho slice đó lên đỉnh.
    // Góc quay = 360*5 - (idx * angle + angle/2)
    const targetAngle = 360 * 5 - (targetIdx * angle + angle / 2);

    const wheel = document.getElementById('wheel');
    wheel.style.transform = `rotate(${targetAngle}deg)`;

    playSound('tick');

    // Sau 4s (khớp transition) → hiện kết quả
    setTimeout(async () => {
      playSound('coin');
      fireConfetti(60);

      // Cập nhật status
      await loadUserStatus();
      const s = state.userStatus || {};

      const resultDiv = document.getElementById('spin-result');
      resultDiv.classList.remove('hidden');
      resultDiv.innerHTML = `
        <div class="bg-gradient-to-r from-sunny to-coral rounded-3xl p-6 text-white animate-pop">
          <div class="text-6xl mb-2">🎉</div>
          <div class="font-baloo text-2xl font-bold mb-1">Chúc mừng!</div>
          <div class="text-4xl font-baloo font-extrabold mb-2">${formatVND(rewardValue)}</div>

        <button id="btn-continue" class="w-full mt-4 bg-brand-500 text-white font-bold py-3 rounded-2xl">Tiếp tục</button>

        playSound('click');
        renderStudentHome();
      });

      btn.textContent = '✅ Đã nhận quà';
    }, 4200);
  });
}

// ===== CACHE HELPERS =====
function cacheGet(key, ttl) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (ttl && Date.now() - obj.ts > ttl) return null;
    return obj.data;
  } catch (e) { return null; }
}
function cacheSet(key, data) {
  try { localStorage.setItem(key, JSON.stringify({ ts: Date.now(), data })); } catch (e) {}
}
function cacheDel(key) {
  try { localStorage.removeItem(key); } catch (e) {}
}
const TTL_QUESTIONS = 24 * 60 * 60 * 1000; // 24h
const TTL_STATUS = 30 * 1000;              // 30s

// ===== OVERRIDE loadUserStatus — cache 30s =====
async function loadUserStatus() {
  if (!state.currentUser || !state.isOnline) return null;
  const uid = state.currentUser.id;
  const cached = cacheGet(`vuihoc_status_${uid}`, TTL_STATUS);
  if (cached) { state.userStatus = cached; return cached; }
  try {
    const status = await apiCall('getUserStatus', { user_id: uid });
    if (status && !status.error) {
      state.userStatus = status;
      cacheSet(`vuihoc_status_${uid}`, status);
      return status;
    }
  } catch (err) { console.warn('[Status]', err); }
  return state.userStatus;
}
function invalidateUserStatus() {
  if (state.currentUser) cacheDel(`vuihoc_status_${state.currentUser.id}`);
}

// ===== OVERRIDE startRound — cache câu hỏi =====
async function startRound() {
  playSound('click');
  const subject = state.selectedSubject;
  const track = state.selectedTrack;
  if (!subject || !track) return;

  const app = document.getElementById('app');
  app.innerHTML = `<section class="flex-1 flex items-center justify-center p-4"><div class="text-center"><div class="spinner"></div><p class="text-brand-600 font-bold mt-4">Đang tải câu hỏi...</p></div></section>`;

  const cacheKey = `vuihoc_questions_${subject.id}_${track.id}`;
  let pool = cacheGet(cacheKey, TTL_QUESTIONS);

  if (!pool) {
    try {
      if (state.isOnline) {
        const data = await apiCall('getQuestions', { subject: subject.id, track: track.id, limit: 500 });
        pool = (data || []).map((q) => shuffleOptions(q));
        if (pool.length > 0) cacheSet(cacheKey, pool);
      }
    } catch (err) { console.warn('[Quiz]', err); }
  }

  if (!pool || pool.length === 0) pool = getLocalQuestions(subject.id, track.id, 10);
  if (pool.length === 0) {
    showToast('Chưa có câu hỏi!', 'warning');
    renderTrackScreen();
    return;
  }

  const questions = [...pool].sort(() => Math.random() - 0.5).slice(0, Math.min(10, pool.length)).map(shuffleOptions);

  state.currentRound = {
    subject, track, questions,
    answers: new Array(questions.length).fill(null),
    currentIndex: 0, score: 0,
    timeLeft: 600, timerId: null, locked: false,
    submitted: false,
  };
  renderQuizScreen();
  startTimer();
}

// ===== OVERRIDE submitRound — hiện kết quả NGAY =====
async function submitRound() {
  const r = state.currentRound;
  if (!r || r.submitted) return;
  r.submitted = true;

  if (r.timerId) clearInterval(r.timerId);
  const score = r.score;
  const total = r.questions.length;

  if (score >= 7) { playSound('win'); fireConfetti(50); }
  else if (score >= 4) { playSound('click'); }

  if (state.currentUser) {
    const prev = parseInt(state.currentUser.total_score) || 0;
    state.currentUser.total_score = prev + score;
    saveScoreLocal(state.currentUser.username, score);
    invalidateUserStatus();
  }

  // Hiện kết quả NGAY
  renderResultScreen(score, total, null);

  // API chạy ngầm
  saveResultInBackground(score, total);
}

async function saveResultInBackground(score, total) {
  const r = state.currentRound;
  if (!r || !state.currentUser || !state.isOnline) return;
  try {
    const rewardData = await apiCall('saveResult', {
      user_id: state.currentUser.id,
      subject_id: r.subject.id,
      track_id: r.track.id,
      score, total_questions: total, round_number: 1,
    }, 'POST');
    invalidateUserStatus();
    if (rewardData && (rewardData.streakRewardTriggered || rewardData.dailyRewardTriggered)) {
      await loadUserStatus();
      setTimeout(() => handleRewardTrigger(rewardData), 500);
    }
  } catch (err) { console.warn('[Save]', err); }
}

async function handleRewardTrigger(rewardData) {
  const u = state.currentUser;
  if (!u) return;
  if (rewardData.streakRewardTriggered) {
    const go = await showRewardPopup(
      'Chúc mừng ' + u.display_name + '!',

      '🎰 Quay ngay', 'Để sau'
    );

// ===== OVERRIDE initLoginEvents — vào Home ngay, bonus ngầm =====
function initLoginEvents() {
  const roleBtns = document.querySelectorAll('.role-btn');
  const roleInput = document.getElementById('role-input');
  const togglePwd = document.getElementById('toggle-password');
  const pwdInput = document.getElementById('password-input');
  const loginBtn = document.getElementById('login-btn');
  const loginBtnText = document.getElementById('login-btn-text');
  const errorBox = document.getElementById('login-error');
  const errorText = document.getElementById('login-error-text');

  roleBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      playSound('click');
      roleBtns.forEach((b) => {
        b.classList.remove('role-active','bg-brand-500','text-white','border-brand-500');
        b.classList.add('bg-white','text-brand-600','border-brand-200');
      });
      btn.classList.add('role-active','bg-brand-500','text-white','border-brand-500');
      btn.classList.remove('bg-white','text-brand-600','border-brand-200');
      state.selectedRole = btn.dataset.role;
      roleInput.value = btn.dataset.role;
      errorBox.classList.add('hidden');
    });
  });

  togglePwd.addEventListener('click', () => {
    playSound('click');
    const isPwd = pwdInput.type === 'password';
    pwdInput.type = isPwd ? 'text' : 'password';
    togglePwd.textContent = isPwd ? '🙈' : '👁️';
  });

  loginBtn.addEventListener('click', doLogin);
  [document.getElementById('username-input'), pwdInput].forEach((el) => {
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
  });

  async function doLogin() {
    const username = document.getElementById('username-input').value.trim().toLowerCase();
    const password = pwdInput.value.trim();
    const role = state.selectedRole;
    errorBox.classList.add('hidden');

    if (!username || !password) {
      errorText.textContent = 'Vui lòng nhập đầy đủ!';
      errorBox.classList.remove('hidden');
      playSound('click');
      return;
    }

    loginBtn.disabled = true;
    loginBtnText.innerHTML = '<div class="spinner" style="width:24px;height:24px;border-width:3px;"></div>';

    let user = null;
    try {
      if (state.isOnline) {
        const data = await apiCall('login', { username, password });
        if (data.user) user = data.user;
      }
    } catch (err) { console.warn('[Login]', err); }

    if (!user) {
      const localUser = FALLBACK_USERS.find((u) => u.username === username && u.password === password);
      if (localUser) { const { password: _, ...rest } = localUser; user = rest; }
    }

    loginBtn.disabled = false;
    loginBtnText.textContent = '🚀 Vào chơi!';

    if (!user) {
      errorText.textContent = 'Sai tên hoặc mật khẩu!';
      errorBox.classList.remove('hidden');
      playSound('click');
      return;
    }
    if (user.role !== 'admin' && user.role !== role) {
      errorText.textContent = `Tài khoản này là "${user.role}"!`;
      errorBox.classList.remove('hidden');
      playSound('click');
      return;
    }

    playSound('win');
    state.currentUser = user;
    showToast(`Chào ${user.display_name}! 🎉`, 'success');

    // Vào Home NGAY — không đợi API
    setTimeout(() => {
      if (user.role === 'student') {
        renderStudentHome();
        claimDailyBonusBackground();
      }
      else if (user.role === 'parent') renderParentHome();
      else renderAdminHome();
    }, 200);
  }
}

async function claimDailyBonusBackground() {
  const user = state.currentUser;
  if (!user || user.role !== 'student' || !state.isOnline) return;

  const today = new Date().toISOString().slice(0, 10);
  const lockKey = `vuihoc_daily_lock_${user.id}_${today}`;
  if (localStorage.getItem(lockKey)) return;
  localStorage.setItem(lockKey, '1');

  try {
    const bonus = await apiCall('claimDailyLogin', { user_id: user.id }, 'POST');
    if (bonus && !bonus.alreadyClaimed && bonus.bonus > 0) {
      invalidateUserStatus();
      setTimeout(async () => {
        showToast(`🎁 Nhận ${formatVND(bonus.bonus)} đăng nhập hôm nay!`, 'success', 4000);
        playSound('coin');
        await loadUserStatus();
        if (document.getElementById('btn-play')) renderStudentHome();
      }, 500);
    }
  } catch (err) {
    console.warn('[Daily]', err);
    localStorage.removeItem(lockKey);
  }
}

// ===== OVERRIDE startRound — hỗ trợ chapter =====
async function startRound() {
  playSound('click');
  const subject = state.selectedSubject;
  const track = state.selectedTrack;
  const chapter = state.selectedChapter || null;
  if (!subject || !track) return;

  const app = document.getElementById('app');
  app.innerHTML = `<section class="flex-1 flex items-center justify-center p-4"><div class="text-center"><div class="spinner"></div><p class="text-brand-600 font-bold mt-4">Đang tải câu hỏi...</p></div></section>`;

  // Cache key phân biệt theo track + chapter
  const cacheKey = chapter
    ? `vuihoc_questions_${subject.id}_${track.id}_${chapter}`
    : `vuihoc_questions_${subject.id}_${track.id}`;

  let pool = cacheGet(cacheKey, TTL_QUESTIONS);

  if (!pool) {
    try {
      if (state.isOnline) {
        const params = { subject: subject.id, track: track.id, limit: 500 };
        if (chapter && chapter !== 'mixed') {
          params.chapter = chapter;
          params.game_type = 'sgk';
        } else if (chapter === 'mixed') {
          // Ôn tập tổng hợp: lấy random từ nhiều chương
          params.game_type = 'sgk';
        }
        const data = await apiCall('getQuestions', params);
        pool = (data || []).map((q) => shuffleOptions(q));
        if (pool.length > 0) cacheSet(cacheKey, pool);
      }
    } catch (err) { console.warn('[Quiz]', err); }
  }

  if (!pool || pool.length === 0) {
    pool = getLocalQuestions(subject.id, track.id, 10);
  }
  if (pool.length === 0) {
    showToast('Chưa có câu hỏi cho mục này!', 'warning');
    renderTrackScreen();
    return;
  }

  const questions = [...pool]
    .sort(() => Math.random() - 0.5)
    .slice(0, Math.min(10, pool.length))
    .map(shuffleOptions);

  state.currentRound = {
    subject, track, chapter, questions,
    answers: new Array(questions.length).fill(null),
    currentIndex: 0, score: 0,
    timeLeft: 600, timerId: null, locked: false,
    submitted: false,
  };
  renderQuizScreen();
  startTimer();
}

          <button id="btn-replay" class="bg-gradient-to-r from-brand-500 to-brand-700 text-white font-bold py-3 rounded-2xl shadow-lg">🔄 Chơi lại</button>
          <button id="btn-home2" class="bg-white text-brand-600 font-bold py-3 rounded-2xl shadow-lg border-2 border-brand-200">🏠 Trang chủ</button>
        </div>
      </div>
    </section>`;

  attachNavEvents({
    onBack: () => {
      if (r.chapter) renderChapterScreen();
      else renderTrackScreen();
    },
    onHome: () => { renderStudentHome(); },
  });
  document.getElementById('btn-replay').addEventListener('click', () => { playSound('click'); startRound(); });
  document.getElementById('btn-home2').addEventListener('click', () => { playSound('click'); renderStudentHome(); });
}

// 1. Ẩn nút Phụ huynh
const __style_p32 = document.createElement('style');
__style_p32.textContent = `
  .role-btn[data-role="parent"] { display: none !important; }
  .role-btn[data-role="student"] { grid-column: span 2 / span 2; }
`;

// 2. Không claim daily bonus khi login
async function claimDailyBonusBackground() {
  return; // Bỏ — chỉ claim sau khi chơi bài đầu tiên
}

// 3. Override submitRound — sau khi chơi, thử claim daily
var __origSubmitRound_v32 = submitRound;
submitRound = async function() {
  const r = state.currentRound;
  if (!r || r.submitted) return;
  r.submitted = true;

  if (r.timerId) clearInterval(r.timerId);
  const score = r.score, total = r.questions.length;

  if (score >= 7) { playSound('win'); fireConfetti(50); }
  else if (score >= 4) { playSound('click'); }

  if (state.currentUser) {
    const prev = parseInt(state.currentUser.total_score) || 0;
    state.currentUser.total_score = prev + score;
    saveScoreLocal(state.currentUser.username, score);
    invalidateUserStatus();
  }

  renderResultScreen(score, total, null);
  __saveAndClaim_v32(score, total);
};

async function __saveAndClaim_v32(score, total) {
  const r = state.currentRound;
  if (!r || !state.currentUser || !state.isOnline) return;
  try {
    const rewardData = await apiCall('saveResult', {
      user_id: state.currentUser.id,
      subject_id: r.subject.id,
      track_id: r.track.id,
      score, total_questions: total, round_number: 1,
    }, 'POST');
    invalidateUserStatus();

    // Thử claim daily bonus sau khi đã chơi 1 bài
    await __tryClaimDaily_v32();

    if (rewardData && (rewardData.streakRewardTriggered || rewardData.dailyRewardTriggered)) {
      await loadUserStatus();
      setTimeout(() => handleRewardTrigger(rewardData), 500);
    }
  } catch (err) { console.warn('[Save]', err); }
}

async function __tryClaimDaily_v32() {
  const user = state.currentUser;
  if (!user || !state.isOnline) return;
  const today = new Date().toISOString().slice(0, 10);
  const lockKey = `vuihoc_daily_lock_${user.id}_${today}`;
  if (localStorage.getItem(lockKey)) return;

  try {
    const bonus = await apiCall('claimDailyLogin', { user_id: user.id }, 'POST');
    if (bonus && bonus.bonus > 0) {
      localStorage.setItem(lockKey, '1');
      invalidateUserStatus();
      showToast(`🎁 Bé đã chơi bài đầu tiên hôm nay! Nhận ${formatVND(bonus.bonus)}`, 'success', 4000);
      playSound('coin');
    } else if (bonus && bonus.alreadyClaimed) {
      localStorage.setItem(lockKey, '1');
    }
  } catch (err) { console.warn('[Daily]', err); }
}

// 4. Override renderWarehouseScreen — đổi quà tự động + lịch sử
async function renderWarehouseScreen() {
  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderNavBar({ showBack: true, showHome: true })}
    <section class="flex-1 p-4 pt-20">
      <div class="max-w-2xl mx-auto w-full bg-white/90 rounded-3xl shadow-2xl p-6">
        <h2 class="font-baloo text-3xl font-bold text-brand-700 text-center mb-2">🎁 Kho quà</h2>
        <p class="text-brand-500 text-center mb-6">Những phần quà bé đã nhận được</p>
        <div id="warehouse-list"><div class="spinner"></div></div>
      </div>
    </section>`;
  attachNavEvents({
    onBack: () => { renderStudentHome(); },
    onHome: () => { renderStudentHome(); },
  });

  let rewards = [];
  let history = [];
  try {
    if (state.isOnline) {
      rewards = (await apiCall('getUserRewards', { user_id: state.currentUser.id })) || [];
      history = (await apiCall('getExchangeHistory', { user_id: state.currentUser.id })) || [];
    }
  } catch (err) { console.warn('[Warehouse]', err); }

  const list = document.getElementById('warehouse-list');
  if (!list) return;

  if (rewards.length === 0 && history.length === 0) {
    list.innerHTML = `
      <div class="text-center p-8">
        <div class="text-6xl mb-3">📭</div>
        <p class="text-brand-500 font-bold mb-4">Kho quà đang trống</p>
        <p class="text-brand-400 text-sm mb-6">Chơi game để nhận phần thưởng nhé!</p>
        <button id="btn-go-play" class="bg-gradient-to-r from-brand-500 to-brand-700 text-white font-bold py-3 px-8 rounded-2xl">🎮 Chơi ngay</button>
      </div>`;
    document.getElementById('btn-go-play').addEventListener('click', () => { playSound('click'); renderSubjectScreen(); });
    return;
  }

  const sourceLabel = { daily_login: '📅 Đăng nhập', streak_5: '🔥 Streak 5', daily_30: '💎 Daily 30', manual: '🎁' };
  const totalValue = rewards.reduce((s, r) => s + (parseInt(r.value) || 0), 0);

  let html = '';
  if (rewards.length > 0) {
    html += `
      <div class="bg-gradient-to-r from-sunny to-coral rounded-3xl p-5 text-white mb-5 text-center">
        <div class="text-sm opacity-90">Tổng giá trị kho</div>
        <div class="font-baloo text-4xl font-extrabold">${formatVND(totalValue)}</div>
        <div class="text-sm opacity-90 mt-1">${rewards.length} phần quà</div>
      </div>
      <div class="grid grid-cols-2 gap-3 mb-5">
        ${rewards.map((r) => `
          <div class="reward-card">
            <div>
              <div class="text-xs opacity-90">${sourceLabel[r.source] || '🎁 Quà'}</div>
              <div class="text-lg font-baloo">${formatVND(parseInt(r.value))}</div>
            </div>
            <div class="text-2xl">🎫</div>
          </div>`).join('')}
      </div>
      <button id="btn-redeem" class="w-full bg-gradient-to-r from-mint to-sky text-white font-bold py-4 rounded-2xl shadow-lg hover:scale-105 transition mb-3">
        💸 Đổi tất cả thành tiền (${formatVND(totalValue)})
      </button>
      <p class="text-xs text-brand-500 text-center mb-5">Sau khi đổi, phụ huynh sẽ trả tiền mặt cho bé</p>
    `;
  } else {
    html += `<div class="text-center p-6 text-brand-500 font-bold">Chưa có quà trong kho</div>`;
  }

  if (history.length > 0) {
    html += `
      <div class="bg-brand-50 rounded-2xl p-4 mt-4">
        <h3 class="font-baloo text-lg font-bold text-brand-700 mb-3">📜 Lịch sử đổi quà</h3>
        <div class="space-y-2">
          ${history.map((h) => {
            const d = new Date(h.created_at);
            const ds = d.toLocaleDateString('vi-VN') + ' ' + d.toLocaleTimeString('vi-VN', {hour: '2-digit', minute: '2-digit'});
            return `
              <div class="flex justify-between items-center bg-white rounded-xl p-3">
                <div>
                  <div class="font-bold text-brand-700">${formatVND(h.total_value)}</div>
                  <div class="text-xs text-brand-500">${h.count} phần quà • ${ds}</div>
                </div>
                <div class="text-2xl">✅</div>
              </div>`;
          }).join('')}
        </div>
      </div>`;
  }

  list.innerHTML = html;

  const redeemBtn = document.getElementById('btn-redeem');
  if (redeemBtn) {
    redeemBtn.addEventListener('click', async () => {
      playSound('click');
      const ok = await showConfirm('Đổi quà?', `Bé sẽ đổi ${rewards.length} phần quà (${formatVND(totalValue)}) thành tiền. Phụ huynh sẽ trả tiền mặt cho bé sau.`, '💸 Đổi', 'Hủy');
      if (!ok) return;

      const ids = rewards.map((r) => r.id).join(',');
      try {
        const res = await apiCall('exchangeRewards', {
          user_id: state.currentUser.id,
          reward_ids: ids,
        }, 'POST');
        if (res && res.ok) {
          playSound('coin');
          fireConfetti(40);
          showToast(`Đổi thành công ${formatVND(res.total_value)}!`, 'success', 3000);
          invalidateUserStatus();
          setTimeout(() => renderWarehouseScreen(), 1500);
        } else {
          showToast((res && res.error) || 'Lỗi đổi quà', 'error');
        }
      } catch (err) {
        console.warn('[Exchange]', err);
        showToast('Lỗi kết nối', 'error');
      }
    });
  }
}

// 1. Đảm bảo manifest + icon được link trong <head>
(function ensurePWALinks() {
  const head = document.head;
  if (!document.querySelector('link[rel="manifest"]')) {
    const l = document.createElement('link');
    l.rel = 'manifest';
    l.href = 'manifest.json';
    head.appendChild(l);
    console.log('[PWA] Đã thêm link manifest');
  }
  if (!document.querySelector('link[rel="icon"][type="image/svg+xml"]')) {
    const i = document.createElement('link');
    i.rel = 'icon';
    i.type = 'image/svg+xml';
    i.href = 'icon.svg';
    head.appendChild(i);
  }
  if (!document.querySelector('link[rel="apple-touch-icon"]')) {
    const a = document.createElement('link');
    a.rel = 'apple-touch-icon';
    a.href = 'icon-192.png';
    head.appendChild(a);
  }
})();

// 2. Đăng ký Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { scope: './' })
      .then((reg) => console.log('[SW] OK:', reg.scope))
      .catch((err) => console.error('[SW] Lỗi:', err));
  });
}

// 3. Kiểm tra manifest load
fetch('manifest.json')
  .then((r) => r.ok ? r.json() : Promise.reject('HTTP ' + r.status))
  .then((d) => console.log('[Manifest] OK:', d.name))
  .catch((e) => console.warn('[Manifest] Lỗi:', e));

// ============================================
// HẾT PATCH v3.3.1
